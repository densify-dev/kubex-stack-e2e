apiVersion: v1
kind: Namespace
metadata:
  name: node-pressure-workload
---
# One pod per worker with its own requests and limits, so every node's sums differ.
apiVersion: v1
kind: Pod
metadata:
  name: on-worker
  namespace: node-pressure-workload
spec:
  nodeSelector:
    kubernetes.io/hostname: kubex-e2e-node-pressure-worker
  containers:
    - name: workload
      image: registry.k8s.io/pause:3.9
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 300m
          memory: 256Mi
        limits:
          cpu: 600m
          memory: 512Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: on-worker2
  namespace: node-pressure-workload
spec:
  nodeSelector:
    kubernetes.io/hostname: kubex-e2e-node-pressure-worker2
  containers:
    - name: workload
      image: registry.k8s.io/pause:3.9
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 500m
          memory: 384Mi
        limits:
          cpu: 800m
          memory: 768Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: on-worker3
  namespace: node-pressure-workload
spec:
  nodeSelector:
    kubernetes.io/hostname: kubex-e2e-node-pressure-worker3
  tolerations:
    - key: stack-e2e.kubex.ai/dedicated
      operator: Equal
      value: pressure
      effect: NoSchedule
  containers:
    - name: workload
      image: registry.k8s.io/pause:3.9
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 700m
          memory: 512Mi
        limits:
          cpu: 1500m
          memory: 1Gi
