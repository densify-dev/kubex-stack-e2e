apiVersion: v1
kind: Namespace
metadata:
  name: stack-validation-workload
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-fixture
  namespace: stack-validation-workload
  labels:
    app.kubernetes.io/name: stack-validation-workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stack-validation-workload
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stack-validation-workload
        app.kubernetes.io/component: fixture
    spec:
      containers:
        - name: workload
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
