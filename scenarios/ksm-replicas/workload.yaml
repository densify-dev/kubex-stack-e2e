apiVersion: v1
kind: Namespace
metadata: {name: ksmr-workload}
---
# Only requests.cpu: one key per resource, so quota usage is reported once by Kubernetes.
apiVersion: v1
kind: ResourceQuota
metadata: {name: ksmr-quota, namespace: ksmr-workload}
spec: {hard: {requests.cpu: "1"}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: ksmr-workload}
spec:
  replicas: 1
  selector: {matchLabels: {stack-e2e.kubex.ai/entity: web}}
  template:
    metadata: {labels: {stack-e2e.kubex.ai/entity: web}}
    spec:
      nodeSelector: {kubernetes.io/hostname: kubex-e2e-ksm-replicas-worker}
      containers:
        - name: app
          image: registry.k8s.io/pause:3.9
          imagePullPolicy: IfNotPresent
          resources: {requests: {cpu: 250m, memory: 64Mi}, limits: {cpu: 500m, memory: 128Mi}}
---
# Completed before the window and kept: its container is terminated.
apiVersion: batch/v1
kind: Job
metadata: {name: done, namespace: ksmr-workload}
spec:
  backoffLimit: 0
  template:
    metadata: {labels: {stack-e2e.kubex.ai/entity: done}}
    spec:
      restartPolicy: Never
      nodeSelector: {kubernetes.io/hostname: kubex-e2e-ksm-replicas-worker}
      containers:
        - name: work
          image: python@sha256:656d12e70054d5fda18a045e2494c96701e9792dd1445f95b3d038df954f57e9
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "exit 0"]
          resources: {requests: {cpu: 125m, memory: 32Mi}, limits: {cpu: 250m, memory: 64Mi}}
