apiVersion: v1
kind: Namespace
metadata:
  name: nodegroup-labels-workload
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mvp-workload
  namespace: nodegroup-labels-workload
  labels:
    app.kubex.ai/name: nodegroup-labels-workload
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubex.ai/name: nodegroup-labels-workload
  template:
    metadata:
      labels:
        app.kubex.ai/name: nodegroup-labels-workload
    spec:
      nodeSelector:
        topology.kubex.ai/node-group: mvp-workers
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubex.ai/name: nodegroup-labels-workload
      containers:
        - name: workload
          image: registry.k8s.io/pause:3.9
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
